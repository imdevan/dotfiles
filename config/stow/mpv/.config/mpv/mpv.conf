autofit=100%
keepaspect=yes
vo=gpu-next
target-colorspace-hint=no

geometry=480x360
# Automatically activate a visualizer for audio-only files

# #################################################################
# AUDIO-ONLY AUTOMATIC VISUALIZER CONFIGURATION                 #
#################################################################

# This profile automatically activates ONLY when playing files with audio but no video
[audio-only]
profile-cond=audio_format and not video_format

# Set a standard default window size and background color for the visualizers
# geometry=1280x720
geometry=480x360

# background-color="#111111"

# ===============================================================
# VISUALIZER PRESETS (Uncomment ONLY ONE line below at a time)
# ===============================================================

# --- OPTION 1: High-Definition Constant Q Transform (Default) ---
# Features a 60fps responsive bar graph with an upward waterfall history graph
# lavfi-complex="[aid1]asplit[ao][a

# --- CUSTOMIZED CONSTANT Q TRANSFORM ---
# 1. sono_h=0 removes the waterfall, pushing the note axis to the bottom edge.
# 2. font='FiraCode Nerd Font' is the fontconfig family name of the installed Fira Code.
# 3. fontcolor=0xFFC0CB forces a light pink hex tone (RGB: 255, 192, 203).
# lavfi-complex="[aid1]asplit[ao][a]; [a]showcqt=s=1280x720:fps=60:count=5:bar_g=2:sono_h=0:font='FiraCode Nerd Font':fontcolor=0xFFC0CB[vo]"

# --- OPTION 2: Rolling Heat-Map Spectrogram ---
# A moving frequency spectrum that scrolls smoothly from right to left using a fire-like gradient
# lavfi-complex="[aid1]asplit[ao][a]; [a]showspectrum=s=1280x720:mode=combined:color=intensity:slide=scroll:scale=log[vo]"

# --- OPTION 3: Classic Graphic Equalizer Bars ---
# Traditional bouncy stereo bars shifting through a cyan to magenta color gradient
# lavfi-complex="[aid1]asplit[ao][a]; [a]showfreqs=s=1280x720:mode=bar:colors=cyan|magenta:ascale=log[vo]"

# --- OPTION 4: Analog Lissajous Vectorscope ---
# Emulates an old-school CRT oscilloscope screen; maps the left/right channels to show stereo width
# lavfi-complex="[aid1]asplit[ao][a]; [a]avectorscope=s=1280x720:mode=lissajous:draw=line:scale=log[vo]"

# --- OPTION 5: Continuous Pulse Waveform ---
# Draws a solid aquamarine block tracking the raw physical volume amplitude of the music
#lavfi-complex="[aid1]asplit[ao][a]; [a]showwaves=s=1280x720:mode=p2p:colors=aquamarine:scale=sqrt[vo]"
